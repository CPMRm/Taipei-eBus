<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雙北公車即時動態追蹤</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet.js CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
      z-index: 1;
      background-color: #f8f9fa;
    }
    .bottom-sheet {
      transition: transform 0.25s ease-out;
      z-index: 1000;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* 即時公車 Icon 樣式 */
    .bus-icon-marker {
      background: #2563eb;
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      text-align: center;
      line-height: 28px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    /* 使用者當前位置定位 Icon */
    .user-location-marker {
      background: #06b6d4;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
    }
  </style>
</head>
<body class="bg-gray-100 relative">

  <!-- 上方狀態通知列 -->
  <div id="status-banner" class="hidden absolute top-4 left-4 right-4 z-[1001] bg-amber-500 text-white px-4 py-2.5 rounded-2xl shadow-lg flex items-center justify-between text-xs sm:text-sm animate-bounce">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-spinner fa-spin text-base"></i>
      <span id="status-message">伺服器連線中，請稍候...</span>
    </div>
  </div>

  <!-- 地圖容器 -->
  <div id="map"></div>

  <!-- 定位按鈕 (定位到我的位置) -->
  <button onclick="getUserLocation(true)" class="absolute top-4 left-4 z-[1000] bg-white text-gray-700 w-10 h-10 rounded-xl shadow-md flex items-center justify-center active:scale-95 transition">
    <i class="fa-solid fa-crosshairs text-lg text-blue-600"></i>
  </button>

  <!-- 底部滑動抽屜 (Bottom Sheet) -->
  <div id="bottom-sheet" class="bottom-sheet fixed inset-x-0 bottom-0 max-w-lg mx-auto bg-white rounded-t-3xl shadow-2xl flex flex-col max-h-[85vh] border-t border-gray-100 transform translate-y-[calc(100%-140px)]">
    
    <!-- 頂部手把與搜尋列 -->
    <div id="sheet-header" class="p-4 pb-2 bg-white rounded-t-3xl select-none touch-none">
      <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-3 cursor-pointer" onclick="toggleSheet()"></div>
      
      <!-- 搜尋列 -->
      <div class="flex gap-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="route-input" placeholder="搜尋公車 (如: 307, 265, 承德幹線)" 
                 class="w-full pl-9 pr-4 py-2.5 bg-gray-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium">
        </div>
        <button onclick="searchBusRoute(true)" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-semibold active:scale-95 transition">
          搜尋
        </button>
      </div>

      <!-- 最近站牌提示條 -->
      <div id="nearest-stop-banner" class="hidden mt-2.5 px-3 py-1.5 bg-cyan-50 border border-cyan-200 rounded-lg text-xs text-cyan-800 flex items-center gap-1.5 font-medium">
        <i class="fa-solid fa-location-dot text-cyan-600"></i>
        <span id="nearest-stop-text">計算離您最近的站牌中...</span>
      </div>

      <!-- 去程/返程 切換頁籤 -->
      <div id="direction-tabs" class="hidden flex gap-2 mt-2.5">
        <button id="tab-go" onclick="switchDirection(0)" class="flex-1 py-1.5 rounded-lg text-xs font-bold bg-blue-50 text-blue-600 border border-blue-200">
          往 去程
        </button>
        <button id="tab-back" onclick="switchDirection(1)" class="flex-1 py-1.5 rounded-lg text-xs font-bold bg-gray-50 text-gray-500 border border-gray-200">
          往 返程
        </button>
      </div>
    </div>

    <!-- 公車動態列表 -->
    <div class="flex-1 overflow-y-auto p-4 space-y-2 no-scrollbar" id="stop-list">
      <div class="text-center py-8 text-gray-400 text-sm">
        <i class="fa-solid fa-bus text-3xl mb-2 text-gray-300"></i>
        <p>請輸入公車路線開始查詢</p>
      </div>
    </div>

    <!-- 底部更新狀態欄 -->
    <div class="p-3 bg-gray-50 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500">
      <div class="flex items-center gap-1.5">
        <span id="status-dot" class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="update-timer">自動更新：30s</span>
      </div>
      <button onclick="refreshData()" class="text-blue-600 font-medium flex items-center gap-1 active:rotate-180 transition">
        <i class="fa-solid fa-rotate-right"></i> 手動更新
      </button>
    </div>
  </div>

  <script>
    const RENDER_PROXY_URL = 'https://bus-api-tw.onrender.com/api/bus';

    let map;
    let markersLayer;
    let userMarker = null;
    let userLatLng = null; // 儲存使用者目前 GPS 座標
    let stopMarkers = new Map();
    let currentRouteName = '';
    let currentCity = 'Taipei';
    let currentDirection = 0;
    let autoRefreshTimer = null;
    let countdown = 30;
    let busDataCache = { 0: [], 1: [] };
    let realTimeBuses = [];
    let isExpanded = false;

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([25.0478, 121.5170], 13);
      
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
      }).addTo(map);

      L.control.zoom({ position: 'topright' }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);

      // 初始化時嘗試取得使用者當前位置
      getUserLocation(false);
    }

    // 取得使用者當前 GPS 位置
    function getUserLocation(flyToUser = false) {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            userLatLng = [lat, lng];

            // 繪製或更新使用者位置標籤
            if (userMarker) {
              userMarker.setLatLng(userLatLng);
            } else {
              const userIcon = L.divIcon({
                className: 'user-location-marker w-4 h-4',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
              });
              userMarker = L.marker(userLatLng, { icon: userIcon }).bindPopup('<b>您的當前位置</b>').addTo(map);
            }

            if (flyToUser) {
              map.flyTo(userLatLng, 16, { duration: 1.2 });
            }

            // 如果已經有搜尋公車，重新計算距離
            calculateNearestStop();
          },
          (err) => {
            if (flyToUser) alert('無法存取您的定位權限，請確認瀏覽器定位設定是否開啟！');
          },
          { enableHighAccuracy: true, timeout: 5000 }
        );
      }
    }

    // 計算半徑距離 (Haversine Formula，回傳公尺)
    function getDistanceInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    // 比對目前路線中距離使用者最近的站牌
    function calculateNearestStop() {
      const banner = document.getElementById('nearest-stop-banner');
      const bannerText = document.getElementById('nearest-stop-text');
      
      if (!userLatLng) {
        banner.classList.add('hidden');
        return;
      }

      const stops = busDataCache[currentDirection] || [];
      if (stops.length === 0) {
        banner.classList.add('hidden');
        return;
      }

      let nearestStop = null;
      let minDistance = Infinity;

      stops.forEach(stop => {
        if (stop.StopPosition) {
          const dist = getDistanceInMeters(userLatLng[0], userLatLng[1], stop.StopPosition.PositionLat, stop.StopPosition.PositionLon);
          if (dist < minDistance) {
            minDistance = dist;
            nearestStop = stop;
          }
        }
      });

      if (nearestStop) {
        banner.classList.remove('hidden');
        bannerText.innerHTML = `您離 <b>${nearestStop.StopName.Zh_tw}</b> 最近（距離約 ${minDistance >= 1000 ? (minDistance/1000).toFixed(1) + ' km' : minDistance + ' m'}）`;
      } else {
        banner.classList.add('hidden');
      }
    }

    // 手勢拖曳滑動抽屜
    const sheet = document.getElementById('bottom-sheet');
    const header = document.getElementById('sheet-header');
    let startY = 0;
    let currentY = 0;

    header.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; });
    header.addEventListener('touchmove', (e) => {
      currentY = e.touches[0].clientY;
      const diff = currentY - startY;
      if (diff > 50 && isExpanded) collapseSheet();
      else if (diff < -50 && !isExpanded) expandSheet();
    });

    function toggleSheet() { if (isExpanded) collapseSheet(); else expandSheet(); }
    function expandSheet() { sheet.style.transform = 'translateY(0)'; isExpanded = true; }
    function collapseSheet() { sheet.style.transform = 'translateY(calc(100% - 140px))'; isExpanded = false; }

    async function fetchWithRetry(url, retries = 4, delay = 3000) {
      for (let i = 0; i < retries; i++) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 12000);
          const response = await fetch(url, { signal: controller.signal });
          clearTimeout(timeoutId);
          if (response.ok) return response;
        } catch (err) {
          if (i === retries - 1) throw err;
          await new Promise(res => setTimeout(res, delay));
        }
      }
    }

    async function searchBusRoute(isManual = false) {
      const input = document.getElementById('route-input').value.trim();
      if (!input) return;

      currentRouteName = input;
      showLoadingBanner(true, "伺服器連線中，請稍候...");

      try {
        const tpeUrl = `${RENDER_PROXY_URL}/DisplayStopOfRoute/City/Taipei?$filter=RouteName/Zh_tw eq '${input}'&$format=JSON`;
        const ntpUrl = `${RENDER_PROXY_URL}/DisplayStopOfRoute/City/NewTaipei?$filter=RouteName/Zh_tw eq '${input}'&$format=JSON`;

        let [tpeRes, ntpRes] = await Promise.all([
          fetchWithRetry(tpeUrl).catch(() => null),
          fetchWithRetry(ntpUrl).catch(() => null)
        ]);

        let routeData = tpeRes ? await tpeRes.json() : [];
        if (routeData && routeData.length > 0) {
          currentCity = 'Taipei';
        } else {
          routeData = ntpRes ? await ntpRes.json() : [];
          if (routeData && routeData.length > 0) {
            currentCity = 'NewTaipei';
          }
        }

        if (!routeData || routeData.length === 0) {
          const tpeMatchUrl = `${RENDER_PROXY_URL}/DisplayStopOfRoute/City/Taipei?$filter=contains(RouteName/Zh_tw, '${input}')&$format=JSON`;
          const ntpMatchUrl = `${RENDER_PROXY_URL}/DisplayStopOfRoute/City/NewTaipei?$filter=contains(RouteName/Zh_tw, '${input}')&$format=JSON`;

          let [tpeMatchRes, ntpMatchRes] = await Promise.all([
            fetchWithRetry(tpeMatchUrl).catch(() => null),
            fetchWithRetry(ntpMatchUrl).catch(() => null)
          ]);

          let matchTpe = tpeMatchRes ? await tpeMatchRes.json() : [];
          let matchNtp = ntpMatchRes ? await ntpMatchRes.json() : [];

          if (matchTpe && matchTpe.length > 0) {
            routeData = matchTpe;
            currentCity = 'Taipei';
          } else if (matchNtp && matchNtp.length > 0) {
            routeData = matchNtp;
            currentCity = 'NewTaipei';
          }
        }

        if (!routeData || routeData.length === 0) {
          showLoadingBanner(true, "找不到該公車路線，請確認輸入是否有誤！");
          setTimeout(() => showLoadingBanner(false), 3000);
          return;
        }

        const realRouteName = routeData[0].RouteName.Zh_tw;

        let etaRes = await fetchWithRetry(`${RENDER_PROXY_URL}/EstimatedTimeOfArrival/City/${currentCity}?$filter=RouteName/Zh_tw eq '${realRouteName}'&$format=JSON`);
        let etaData = await etaRes.json();

        try {
          let busPosRes = await fetchWithRetry(`${RENDER_PROXY_URL}/RealTimeByFrequency/City/${currentCity}?$filter=RouteName/Zh_tw eq '${realRouteName}'&$format=JSON`);
          realTimeBuses = await busPosRes.json();
        } catch (e) {
          realTimeBuses = [];
        }

        const etaMap = new Map();
        if (Array.isArray(etaData)) {
          etaData.forEach(item => {
            if (item.StopID !== undefined) {
              etaMap.set(`${item.StopID}_${item.Direction}`, item);
            }
          });
        }

        [0, 1].forEach(dir => {
          const dirStops = routeData.find(r => r.Direction === dir);
          if (dirStops && dirStops.Stops) {
            busDataCache[dir] = dirStops.Stops.map(stop => {
              const etaKey = `${stop.StopID}_${dir}`;
              const eta = etaMap.get(etaKey);
              return {
                StopID: stop.StopID,
                StopSequence: stop.StopSequence,
                StopName: stop.StopName,
                StopPosition: stop.StopPosition,
                EstimateTime: eta ? eta.EstimateTime : null,
                StopStatus: eta ? eta.StopStatus : 1
              };
            });
          } else {
            busDataCache[dir] = [];
          }
        });

        document.getElementById('direction-tabs').classList.remove('hidden');
        
        const goDest = busDataCache[0].length > 0 ? busDataCache[0][busDataCache[0].length - 1].StopName.Zh_tw : '去程';
        const backDest = busDataCache[1].length > 0 ? busDataCache[1][busDataCache[1].length - 1].StopName.Zh_tw : '返程';
        
        document.getElementById('tab-go').innerText = `往 ${goDest}`;
        document.getElementById('tab-back').innerText = `往 ${backDest}`;

        renderStops();
        calculateNearestStop(); // 重新計算最近的站牌
        if (isManual) expandSheet();
        
        document.getElementById('status-dot').className = 'inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
        showLoadingBanner(false);
      } catch (err) {
        console.error('Fetch error:', err);
        showLoadingBanner(true, "連線較慢，正在嘗試重新連線...");
        setTimeout(() => showLoadingBanner(false), 4000);
        document.getElementById('status-dot').className = 'inline-block w-2 h-2 rounded-full bg-red-500';
      } finally {
        startAutoRefresh();
      }
    }

    function renderStops() {
      const listContainer = document.getElementById('stop-list');
      const stops = busDataCache[currentDirection] || [];

      if (stops.length === 0) {
        listContainer.innerHTML = '<div class="text-center py-6 text-gray-400 text-sm">目前無此方向車次動態</div>';
        return;
      }

      markersLayer.clearLayers();
      stopMarkers.clear();
      let html = '';
      let bounds = [];
      let routeCoordinates = [];

      stops.forEach((stop, index) => {
        const seqNum = stop.StopSequence !== undefined ? stop.StopSequence : index + 1;
        const stopName = stop.StopName?.Zh_tw || '未知名稱';
        const timeStatus = formatEstimateTime(stop.EstimateTime, stop.StopStatus);

        html += `
          <div onclick="focusStop('${stop.StopID}', ${stop.StopPosition?.PositionLat}, ${stop.StopPosition?.PositionLon})" 
               class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-100 hover:bg-blue-50 active:scale-[0.98] transition cursor-pointer">
            <div class="flex items-center gap-3">
              <span class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 font-bold text-xs flex items-center justify-center flex-shrink-0">
                ${seqNum}
              </span>
              <span class="font-bold text-gray-800 text-sm">${stopName}</span>
            </div>
            <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${timeStatus.bgClass} flex-shrink-0">
              ${timeStatus.text}
            </span>
          </div>
        `;

        if (stop.StopPosition) {
          const lat = stop.StopPosition.PositionLat;
          const lng = stop.StopPosition.PositionLon;
          bounds.push([lat, lng]);
          routeCoordinates.push([lat, lng]);

          const marker = L.circleMarker([lat, lng], {
            radius: 5,
            fillColor: timeStatus.color,
            color: '#ffffff',
            weight: 1.5,
            fillOpacity: 1
          }).bindPopup(`
            <div class="text-center p-1">
              <div class="font-bold text-sm text-gray-800 mb-1">${stopName}</div>
              <div class="inline-block px-2 py-0.5 rounded text-xs font-bold ${timeStatus.bgClass}">
                ${timeStatus.text}
              </div>
            </div>
          `).addTo(markersLayer);

          if (stop.StopID) {
            stopMarkers.set(stop.StopID, marker);
          }
        }
      });

      if (routeCoordinates.length > 1) {
        L.polyline(routeCoordinates, {
          color: '#2563eb',
          weight: 5,
          opacity: 0.75,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(markersLayer);
      }

      if (Array.isArray(realTimeBuses)) {
        const currentDirBuses = realTimeBuses.filter(b => b.Direction === currentDirection && b.BusPosition);
        currentDirBuses.forEach(bus => {
          const busLat = bus.BusPosition.PositionLat;
          const busLng = bus.BusPosition.PositionLon;
          const plateNumb = bus.PlateNumb || '公車';

          const busIcon = L.divIcon({
            className: 'custom-bus-icon',
            html: `<div class="bus-icon-marker w-7 h-7 flex items-center justify-center text-xs"><i class="fa-solid fa-bus"></i></div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });

          L.marker([busLat, busLng], { icon: busIcon })
            .bindPopup(`<b>車牌：${plateNumb}</b><br>動態：行駛中`)
            .addTo(markersLayer);
        });
      }

      listContainer.innerHTML = html;

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50] });
      }
    }

    function focusStop(stopId, lat, lng) {
      if (!lat || !lng) return;
      map.flyTo([lat, lng], 16, { duration: 1.2 });
      collapseSheet();

      const marker = stopMarkers.get(stopId);
      if (marker) {
        setTimeout(() => {
          marker.openPopup();
        }, 800);
      }
    }

    function formatEstimateTime(seconds, status) {
      if (status === 1) return { text: '尚未發車', bgClass: 'bg-gray-200 text-gray-600', color: '#9CA3AF' };
      if (status === 2) return { text: '交管不停靠', bgClass: 'bg-gray-200 text-gray-600', color: '#9CA3AF' };
      if (status === 3) return { text: '末班車已過', bgClass: 'bg-gray-200 text-gray-600', color: '#9CA3AF' };
      if (status === 4) return { text: '今日未營運', bgClass: 'bg-gray-200 text-gray-600', color: '#9CA3AF' };

      if (seconds === undefined || seconds === null) return { text: '離站', bgClass: 'bg-gray-100 text-gray-400', color: '#D1D5DB' };

      const min = Math.floor(seconds / 60);
      if (min < 1) return { text: '進站中', bgClass: 'bg-red-500 text-white animate-pulse', color: '#EF4444' };
      if (min <= 3) return { text: '即將到站', bgClass: 'bg-amber-500 text-white', color: '#F59E0B' };
      return { text: `${min} 分鐘`, bgClass: 'bg-emerald-100 text-emerald-700', color: '#10B981' };
    }

    function switchDirection(dir) {
      currentDirection = dir;
      const tabGo = document.getElementById('tab-go');
      const tabBack = document.getElementById('tab-back');

      if (dir === 0) {
        tabGo.className = 'flex-1 py-1.5 rounded-lg text-xs font-bold bg-blue-50 text-blue-600 border border-blue-200';
        tabBack.className = 'flex-1 py-1.5 rounded-lg text-xs font-bold bg-gray-50 text-gray-500 border border-gray-200';
      } else {
        tabBack.className = 'flex-1 py-1.5 rounded-lg text-xs font-bold bg-blue-50 text-blue-600 border border-blue-200';
        tabGo.className = 'flex-1 py-1.5 rounded-lg text-xs font-bold bg-gray-50 text-gray-500 border border-gray-200';
      }

      renderStops();
      calculateNearestStop();
    }

    function startAutoRefresh() {
      clearInterval(autoRefreshTimer);
      countdown = 30;
      document.getElementById('update-timer').innerText = `自動更新：30s`;
      autoRefreshTimer = setInterval(() => {
        countdown--;
        if (countdown < 0) countdown = 0;
        document.getElementById('update-timer').innerText = `自動更新：${countdown}s`;
        if (countdown === 0) {
          clearInterval(autoRefreshTimer);
          refreshData();
        }
      }, 1000);
    }

    async function refreshData() {
      if (!currentRouteName) return;
      await searchBusRoute(false);
    }

    function showLoadingBanner(show, msg = "伺服器正在連線中，請稍候...") {
      const banner = document.getElementById('status-banner');
      const msgElem = document.getElementById('status-message');
      if (msgElem) msgElem.innerText = msg;
      
      if (show) banner.classList.remove('hidden');
      else banner.classList.add('hidden');
    }

    window.onload = () => {
      initMap();
    };
  </script>
</body>
</html>
